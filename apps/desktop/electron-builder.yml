appId: dev.kalem.desktop
productName: Kalem
copyright: Copyright © 2026 Yusuf Koçak

directories:
  output: release
  buildResources: resources

# Everything is bundled into dist/; no node_modules are shipped.
files:
  - dist/**
  - package.json
  - "!**/*.map"

# Chromium ships ~50 MB of UI locales; the app only speaks these two.
electronLanguages:
  - en-US
  - tr

fileAssociations:
  - ext: md
    name: Kalem.Markdown
    description: Markdown document
    role: Editor
  - ext: markdown
    name: Kalem.Markdown
    description: Markdown document
    role: Editor

win:
  target:
    - nsis
    - portable

# The launcher unpacks the app into a per-build cache (see patches/app-builder-lib*.patch),
# so only the first launch of a new exe waits; the splash covers that wait.
portable:
  splashImage: resources/splash.bmp

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  target:
    - dmg

linux:
  category: Office
  target:
    - AppImage
    - deb
