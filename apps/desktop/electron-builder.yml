appId: dev.kalem.desktop
productName: Kalem
copyright: Copyright © 2026 Yusuf Koçak

directories:
  output: release
  buildResources: resources

# Everything is bundled into dist/; no node_modules are shipped.
files:
  - dist/**
  - package.json
  - "!**/*.map"

# Chromium ships ~50 MB of UI locales; the app only speaks these two.
electronLanguages:
  - en-US
  - tr

fileAssociations:
  - ext: md
    name: Kalem.Markdown
    description: Markdown document
    role: Editor
  - ext: markdown
    name: Kalem.Markdown
    description: Markdown document
    role: Editor
  - ext: kmd
    name: Kalem.Package
    description: Kalem package
    role: Editor

win:
  target:
    - nsis
    - portable

# The launcher unpacks the app into a per-build cache (see patches/app-builder-lib*.patch),
# so only the first launch of a new exe waits; the splash covers that wait.
portable:
  splashImage: resources/splash.bmp
  # Hyphens, as GitHub names the uploaded assets; latest.yml must match them.
  artifactName: ${productName}-${version}.${ext}

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  target:
    - dmg

linux:
  category: Office
  target:
    - AppImage
    - deb

# Writes latest.yml next to the installer and app-update.yml into the app.
# The app picks the release itself (desktop-v* tags) and points the updater
# at that release's downloads; see src/main/updater.ts.
publish:
  provider: generic
  url: https://github.com/yusufkocak1/kalem/releases/latest/download
