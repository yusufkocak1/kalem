<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Production policy. The dev server relaxes connect-src only (see vite.config.ts). -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http: kalem-doc:; font-src 'self' data:; connect-src 'self'; base-uri kalem-doc:; form-action 'none'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kalem</title>
		<!-- Inline so the loading screen is the window's first paint, before any script runs. -->
		<style>
			.boot {
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 14px;
				--boot-cut: #e9e7e3;
				background: #e9e7e3;
				color: #0f4e4a;
				transition: opacity 160ms ease-out;
			}
			.boot.done {
				opacity: 0;
				pointer-events: none;
			}
			.boot-nib {
				width: 44px;
				height: 66px;
				transform-origin: 50% 100%;
				animation: boot-write 1.2s ease-in-out infinite;
			}
			.boot-name {
				margin: 0;
				color: #1f1d23;
				font: 700 30px / 1 Georgia, "Times New Roman", serif;
			}
			.boot-bar {
				width: 150px;
				height: 3px;
				overflow: hidden;
				border-radius: 2px;
				background: color-mix(in srgb, currentColor 18%, transparent);
			}
			.boot-bar::after {
				content: "";
				display: block;
				width: 40%;
				height: 100%;
				border-radius: inherit;
				background: currentColor;
				animation: boot-slide 1.1s ease-in-out infinite;
			}
			@keyframes boot-write {
				0%,
				100% {
					transform: rotate(-7deg);
				}
				50% {
					transform: rotate(7deg) translateY(-3px);
				}
			}
			@keyframes boot-slide {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
			@media (prefers-color-scheme: dark) {
				.boot {
					--boot-cut: #17161b;
					background: #17161b;
					color: #6fd3c6;
				}
				.boot-name {
					color: #ecebef;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-nib,
				.boot-bar::after {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div class="boot" id="boot" role="status" aria-label="Kalem">
			<svg class="boot-nib" viewBox="0 0 44 66" aria-hidden="true">
				<path d="M22 0 L44 30 L35 66 H9 L0 30 Z" fill="currentColor" />
				<path d="M22 4 V38" style="stroke: var(--boot-cut)" stroke-width="2.5" />
				<circle cx="22" cy="40" r="4.5" style="fill: var(--boot-cut)" />
			</svg>
			<p class="boot-name">Kalem</p>
			<div class="boot-bar"></div>
		</div>
		<div id="app"></div>
		<script type="module" src="/src/renderer/main.ts"></script>
	</body>
</html>
