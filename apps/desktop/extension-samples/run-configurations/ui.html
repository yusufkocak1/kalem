<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="/__kalem/ui.css" />
		<link rel="stylesheet" href="ui.css" />
		<script src="/__kalem/ui.js"></script>
		<script type="module" src="ui.js"></script>
	</head>
	<body>
		<div class="toolbar">
			<select id="selected" aria-label="Configuration"></select>
			<button id="run" class="primary" type="button" title="Run">▶ Run</button>
			<button id="stop" type="button" title="Stop" disabled>■ Stop</button>
			<button id="edit" type="button">Edit Configurations…</button>
			<span class="spacer"></span>
			<button id="clear" type="button" title="Clear the output">Clear</button>
		</div>
		<p id="message" class="muted" role="status"></p>

		<section id="console">
			<div id="tabs" class="tabs" role="tablist"></div>
			<pre id="output" class="output"></pre>
		</section>

		<section id="editor" hidden>
			<aside class="list">
				<div class="list-actions">
					<select id="add" aria-label="Add a configuration">
						<option value="">+ Add…</option>
					</select>
					<button id="copy" type="button" title="Copy">Copy</button>
					<button id="remove" type="button" title="Remove">Remove</button>
				</div>
				<ul id="configs"></ul>
			</aside>
			<form id="form" class="form" autocomplete="off"></form>
			<div class="editor-actions">
				<span id="problems" class="error"></span>
				<button id="cancel" type="button">Cancel</button>
				<button id="save" class="primary" type="button">Save</button>
			</div>
		</section>
	</body>
</html>
