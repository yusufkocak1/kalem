<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="/__kalem/ui.css" />
		<link rel="stylesheet" href="ui.css" />
		<script src="/__kalem/ui.js"></script>
		<script type="module" src="ui.js"></script>
	</head>
	<body>
		<form id="form" class="bar">
			<input id="query" type="search" placeholder="level:3 AND source:api*" spellcheck="false" autocomplete="off" aria-label="Query" />
			<select id="range" aria-label="Time">
				<option value="5">5 min</option>
				<option value="15" selected>15 min</option>
				<option value="60">1 h</option>
				<option value="240">4 h</option>
				<option value="1440">24 h</option>
				<option value="10080">7 d</option>
			</select>
			<select id="stream" aria-label="Stream"><option value="">All streams</option></select>
			<button id="go" class="primary" type="submit">Search</button>
		</form>
		<p id="status" class="muted" role="status"></p>
		<div class="results">
			<table id="table" hidden>
				<thead><tr id="head"></tr></thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</body>
</html>
