packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'

# Tek sürüm kaynağı: tüm paketler devDeps'i buradan çeker (catalog:).
# Sürüm yükseltmesi tek satırda yapılır, paketler arası kayma olmaz.
catalog:
  '@types/node': ^22.10.2
  fast-check: ^4.9.0
  '@arethetypeswrong/cli': ^0.18.5
  '@biomejs/biome': ^2.5.12
  '@playwright/test': ^1.63.0
  '@size-limit/preset-small-lib': ^13.0.3
  '@vitest/coverage-v8': ^5.0.0
  publint: ^0.3.24
  size-limit: ^13.0.3
  tsdown: ^0.23.0
  typescript: ^7.0.2
  vitest: ^5.0.0

# Faz 5 — sarmalayıcılar ve örnek uygulamalar. React burada `catalog:`
# çünkü hem paketin devDeps'inde hem örneklerde geçiyor; sürüm kayması
# "hangi React ile test edildi" sorusunu cevapsız bırakırdı.
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.1.0
  vite: ^6.4.3
  vue: ^3.5.42
  '@vitejs/plugin-vue': ^6.0.8
  vue-tsc: ^3.3.11
  svelte: ^5.57.0
  '@sveltejs/vite-plugin-svelte': ^6.2.4
  '@angular/core': ^21.2.0
  '@angular/common': ^21.2.0
  '@angular/compiler': ^21.2.0
  '@angular/compiler-cli': ^21.2.0
  '@angular/platform-browser': ^21.2.0
  '@angular/build': ^21.2.0
  '@angular/cli': ^21.2.0
  rxjs: ^7.8.2
  tslib: ^2.8.1

# Angular derleyicisi TypeScript sürümüne kilitli (`>=5.9 <6.0`) ve deponun
# geri kalanı TypeScript 7 kullanıyor. İkisi yan yana durabilsin diye
# Angular örneği kendi kataloğundan çekiyor; başka hiçbir paket bu girdiye
# dokunmuyor.
catalogs:
  ng:
    typescript: ~5.9.0

# `@angular/build` birim testi için vitest'i eş bağımlılık sayıyor; örnekte
# Angular testi yok ve deponun vitest'i başka bir ana sürümde. Uyarı
# bastırılıyor, bağımlılık eklenmiyor.
peerDependencyRules:
  allowedVersions:
    '@angular/build>vitest': '*'

# sharp yalnızca dokümantasyon sitesi (apps/docs) için; yayımlanan
# paketlerin hiçbirine girmez.
onlyBuiltDependencies:
  - '@biomejs/biome'
  - simple-git-hooks
  - esbuild
  - sharp
