name: Feature request
description: A new capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the situation you ran into, not the feature.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
