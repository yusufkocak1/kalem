name: Özellik önerisi
description: Yeni bir yetenek veya iyileştirme
labels: ["öneri"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi problemi çözüyor?
      description: Özelliği değil, karşılaştığın durumu anlat.
    validations: { required: true }
  - type: textarea
    id: oneri
    attributes:
      label: Önerin
    validations: { required: true }
  - type: dropdown
    id: paket
    attributes:
      label: Hangi paket?
      options: [core, viewer, editor, ui, react, vue, wc, eklenti, emin değilim]
    validations: { required: true }
  - type: checkboxes
    id: kisitlar
    attributes:
      label: Kısıtları okudum
      description: Bu üçü projenin var oluş sebebi ve pazarlığa kapalı.
      options:
        - label: Öneri çekirdeğe 3rd-party bağımlılık eklemiyor
        - label: Öneri bir framework'e bağ yaratmıyor
        - label: Boyut etkisini düşündüm (bütçeler CONTRIBUTING.md'de)
