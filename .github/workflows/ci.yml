name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Locale'e duyarlı hataları ortaya çıkarmak için CI Türkçe locale altında koşar.
  LANG: tr_TR.UTF-8
  LC_ALL: tr_TR.UTF-8

jobs:
  dogrulama:
    name: lint · tip · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm exec biome ci .

      - name: Locale kapısı
        run: pnpm guard:locale

      - name: Koruyucu kapıların öz-testi
        run: pnpm guard:selftest

      - name: Tip denetimi
        run: pnpm typecheck

      - name: Birim testleri
        run: pnpm test:cov

  paket:
    name: build · boyut · yayın sağlığı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Saflık kapısı (framework sızıntısı + SSR güvenliği)
        run: pnpm guard:purity

      - name: Boyut kapısı
        run: pnpm size

      - name: Boyut iddiaları (belgelerdeki sayılar ölçümle aynı mı)
        run: pnpm guard:sizes

      - name: publint
        run: pnpm publint

      - name: Tip yayın uyumu (are-the-types-wrong)
        run: pnpm attw

  tarayici:
    name: tarayıcı testleri
    runs-on: ubuntu-latest
    # Görsel regresyon (F3-11) referansları yazı tipi çizimine bağlı. İş
    # Playwright'ın resmi imajında koşuyor, çünkü Linux referansları
    # **aynı imajda** üretildi: `ubuntu-latest`in kendi yazı tipleri
    # (`playwright install --with-deps` ile gelenler dâhil) pikseli
    # değiştirebiliyor. Etiket `@playwright/test` sürümüyle aynı olmalı —
    # biri güncellenince öteki de.
    #
    # Referansları yeniden üretmek (CSS bilerek değiştiğinde):
    #   docker run --rm --ipc=host -v "$PWD:/src" -w /src \
    #     mcr.microsoft.com/playwright:v1.63.0-noble \
    #     bash -c "npm i -g pnpm@10.18.2 && pnpm install && \
    #       pnpm exec playwright test e2e/visual.spec.ts --project=chromium --update-snapshots"
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # Firefox imajda root olarak koşarken HOME'u kendi dizini sanmazsa
      # açılmıyor (Playwright belgelerindeki kurulum).
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-raporu
          path: playwright-report/
          retention-days: 7

  yayin-provasi:
    name: yayın provası (paket dosyalarından temiz kurulum)
    runs-on: ubuntu-latest
    # Tarayıcı adımı Chromium istiyor; imaj onu hazır getiriyor.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm pack` → içerik denetimi → `npm publish --dry-run` → depo
      # dışında yalnızca arşivlerden kurulum → Node ESM/CJS → esbuild ile
      # derlenmiş uygulama ve IIFE tarayıcıda (F6-12).
      - run: pnpm yayin:prova

  ornekler:
    name: örnek uygulamalar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Örnekler paketlerin **yayımlanacak çıktısını** tüketiyor; kaynağa
      # takma ad verilmiyor. Bu yüzden önce paketler derleniyor.
      - run: pnpm build

      # Yedi örneğin derlemesi kendi adımında: biri kırıldığında rapor
      # doğrudan onu gösteriyor, tarayıcı testlerinin arasında kaybolmuyor.
      - name: Örnekleri derle (react-vite · nextjs · vue-vite · nuxt · svelte · angular · cdn-vanilla)
        run: pnpm build:examples

      # F5-05 dogfooding uygulaması; örnek değil ama aynı boru hattından
      # geçiyor — kütüphane kırıldığında ilk haber veren yer burası.
      - name: Notlar uygulamasını derle
        run: pnpm build:notlar

      # F6-06 playground: ürünün vitrini.
      - name: Playground'u derle
        run: pnpm build:playground

      - run: pnpm exec playwright install --with-deps chromium
      # `e2e:examples` derlemeyi kendisi de çalıştırıyor (yukarıdakinden
      # sonra artımlı): derleme kırılırsa test hiç başlamıyor.
      - run: pnpm e2e:examples

  dokuman:
    name: dokümantasyon sitesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 Node 22.12+ istiyor; deponun geri kalanı 20'de de koşuyor.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Site artık kütüphaneyi **gerçekten gömüyor** (F6-03: `/canli/`
      # sayfasında vanilla, React ve Vue örnekleri aynı anda çalışıyor),
      # yani paketlerin derlenmiş çıktısına ihtiyacı var.
      - run: pnpm build

      # API referansı (F6-04) bu adımda TypeDoc'tan üretiliyor.
      - run: pnpm docs:build

      # Kapı derlemeden **sonra**: iki denetimi var ve ikincisi üretilen
      # referansa bakıyor. Birincisi elle yazılan sayfalardaki her
      # `import { … } from "@kalem/…"` adının gerçekten var olduğunu,
      # ikincisi her genel dışa aktarmanın referansta geçtiğini ölçüyor.
      - run: pnpm guard:docs
