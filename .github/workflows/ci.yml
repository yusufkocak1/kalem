name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Locale'e duyarlı hataları ortaya çıkarmak için CI Türkçe locale altında koşar.
  LANG: tr_TR.UTF-8
  LC_ALL: tr_TR.UTF-8

jobs:
  dogrulama:
    name: lint · tip · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm exec biome ci .

      - name: Locale kapısı
        run: pnpm guard:locale

      - name: Koruyucu kapıların öz-testi
        run: pnpm guard:selftest

      - name: Tip denetimi
        run: pnpm typecheck

      - name: Birim testleri
        run: pnpm test:cov

  paket:
    name: build · boyut · yayın sağlığı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Saflık kapısı (framework sızıntısı + SSR güvenliği)
        run: pnpm guard:purity

      - name: Boyut kapısı
        run: pnpm size

      - name: publint
        run: pnpm publint

      - name: Tip yayın uyumu (are-the-types-wrong)
        run: pnpm attw

  tarayici:
    name: tarayıcı testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Görsel regresyon (F3-11) referansları platforma bağlı: yazı tipi
      # çizimi Windows ile Linux arasında birebir aynı değil. Bu iş
      # `ubuntu-latest`te koşuyor; Linux referansları depoda yoksa o
      # testler **atlanıyor** ve sebebi raporda yazıyor.
      #
      # Linux referanslarını üretmek için bu iş bir kez
      # `pnpm e2e --update-snapshots` ile koşturulup üretilen
      # `e2e/visual.spec.ts-snapshots/*-linux.png` dosyaları commit'lenmeli.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-raporu
          path: playwright-report/
          retention-days: 7

  ornekler:
    name: örnek uygulamalar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Örnekler paketlerin **yayımlanacak çıktısını** tüketiyor; kaynağa
      # takma ad verilmiyor. Bu yüzden önce paketler derleniyor.
      - run: pnpm build

      # Yedi örneğin derlemesi kendi adımında: biri kırıldığında rapor
      # doğrudan onu gösteriyor, tarayıcı testlerinin arasında kaybolmuyor.
      - name: Örnekleri derle (react-vite · nextjs · vue-vite · nuxt · svelte · angular · cdn-vanilla)
        run: pnpm build:examples

      # F5-05 dogfooding uygulaması; örnek değil ama aynı boru hattından
      # geçiyor — kütüphane kırıldığında ilk haber veren yer burası.
      - name: Notlar uygulamasını derle
        run: pnpm build:notlar

      - run: pnpm exec playwright install --with-deps chromium
      # `e2e:examples` derlemeyi kendisi de çalıştırıyor (yukarıdakinden
      # sonra artımlı): derleme kırılırsa test hiç başlamıyor.
      - run: pnpm e2e:examples

  dokuman:
    name: dokümantasyon sitesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 Node 22.12+ istiyor; deponun geri kalanı 20'de de koşuyor.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Örneklerdeki her `import { … } from "@kalem/…"` adı gerçekten var
      # mı: site bir kez, kütüphane yazılmadan önce yazıldı ve on beş görev
      # boyunca kimse fark etmeden yanlış kaldı.
      - run: pnpm guard:docs

      # Site kütüphaneyi henüz gömmüyor (F6-03) ama derlemesi kırılırsa
      # sessizce çürümesin: duyuru günü eksik doküman = kaybedilmiş fırsat.
      - run: pnpm docs:build
